<!doctype html>
<html lang="pt-BR" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Apply the saved preference before styles and React render the page.
      try {
        if (localStorage.getItem("theme") === "dark") {
          document.documentElement.dataset.theme = "dark";
        }
      } catch {
        // Storage may be unavailable; the default remains light.
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B1220" />
    <meta
      name="description"
      content="Protótipo acadêmico de conscientização contra phishing."
    />
    <title>Conscientização contra phishing</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
